# 广告和隐私规则共用一个策略组；选择 direct 即关闭拦截。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=广告规则, force-policy=🛡️ 广告拦截, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Privacy/Privacy.list, tag=隐私规则, force-policy=🛡️ 广告拦截, update-interval=86400

# ✈️X电报
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram, force-policy=✈️X电报, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Twitter/Twitter.list, tag=X, force-policy=✈️X电报, update-interval=86400

# 🤖 AI平台
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI-ChatGPT-Codex, force-policy=🤖 AI平台, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Claude/Claude.list, tag=Claude, force-policy=🤖 AI平台, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Gemini/Gemini.list, tag=Gemini, force-policy=🤖 AI平台, update-interval=86400

# ▶️YouTube、🎵Spotify
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=▶️YouTube, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Spotify/Spotify.list, tag=Spotify, force-policy=🎵Spotify, update-interval=86400
https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/%E5%9C%88X%E8%A7%84%E5%88%99/%E5%93%94%E5%93%A9%E5%93%94%E5%93%A9.list, tag=哔哩哔哩, img-url=https://github.com/Koolson/Qure/raw/master/IconSet/mini/bilibili.png, force-policy=📺哔哩哔哩, update-interval=86400

# Apple 服务直连；显式覆盖 4-courier.push.apple.com 等推送域名。
https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/%E5%9C%88X%E8%A7%84%E5%88%99/%E8%8B%B9%E6%9E%9C%E6%9C%8D%E5%8A%A1.list, tag=苹果服务直连, force-policy=direct, update-interval=86400

# 自定义规则：AWS 服务使用专用 AWS 节点，并优先于 Amazon 电商规则。
https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/%E5%9C%88X%E8%A7%84%E5%88%99/AWS%E6%9C%8D%E5%8A%A1.list, tag=AWS服务, force-policy=☁️ AWS亚马逊服务器节点, update-interval=86400
https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/%E5%9C%88X%E8%A7%84%E5%88%99/Amazon%E7%94%B5%E5%95%86.list, tag=Amazon电商, force-policy=🛒Amazon电商, update-interval=86400
https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/%E5%9C%88X%E8%A7%84%E5%88%99/Wildberries%E7%94%B5%E5%95%86.list, tag=Wildberries电商, force-policy=🇷🇺Wildberries电商, update-interval=86400

# 中国大陆域名直连
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMax/ChinaMax.list, tag=中国大陆直连, force-policy=direct, update-interval=86400

