# 圈 X 分流模板（第一版）
# 项目仓库：https://github.com/Champion-Guan/personal-proxy-rules
# 节点名称由 SubStore/订阅本身提供；本文件负责策略组和远程分流。

[general]

[policy]
# 🚀 节点管理
static=🚀 节点选择, ♻️ 自动选择, 🛠️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, ☁️ AWS亚马逊服务器节点, 🇹🇼 台湾节点, direct

# ♻️ 全节点自动测速和 🛠️ 手动选择
url-latency-benchmark=♻️ 自动选择, server-tag-regex=^(?!.*(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)).*$, check-interval=600, tolerance=0
available=🛠️ 手动选择, server-tag-regex=.*$

# 服务策略
static=🤖 AI平台, 🇺🇸 美国节点, 🚀 节点选择, ♻️ 自动选择, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🛠️ 手动选择, direct
static=✈️X电报, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=▶️YouTube, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=📺哔哩哔哩, 🇹🇼 台湾节点, 🇭🇰 香港节点, direct
static=🎵Spotify, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=🇷🇺Wildberries电商, direct, 🚀 节点选择
static=🛒Amazon电商, direct, 🚀 节点选择

# 地区自动测速
url-latency-benchmark=☁️ AWS亚马逊服务器节点, server-tag-regex=.*(AWS|亚马逊|Amazon).*, check-interval=600, tolerance=0
url-latency-benchmark=🇺🇸 美国节点, server-tag-regex=.*(美国|美西|美东|美中|美南|🇺🇸|United ?States|洛杉矶|纽约|旧金山|西雅图|芝加哥|达拉斯|俄亥俄|俄勒冈|弗吉尼亚|Los ?Angeles|New ?York|San ?Francisco|Seattle|Chicago|Dallas|Ohio|Oregon|Virginia|(^|[^A-Za-z])(US|USA)([^A-Za-z]|$)).*, check-interval=600, tolerance=0
url-latency-benchmark=🇯🇵 日本节点, server-tag-regex=.*(日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo).*, check-interval=600, tolerance=0
url-latency-benchmark=🇸🇬 新加坡节点, server-tag-regex=.*(新加坡|狮城|SG|Singapore).*, check-interval=600, tolerance=0
url-latency-benchmark=🇭🇰 香港节点, server-tag-regex=.*(香港|港|HK|Hong ?Kong|HongKong).*, check-interval=600, tolerance=0
url-latency-benchmark=🇹🇼 台湾节点, server-tag-regex=.*(台湾|台灣|台|TW|Taiwan|台北|臺北|高雄|Taipei|Kaohsiung).*, check-interval=600, tolerance=0

static=🛡️ 广告拦截, reject, direct
static=🛟 漏网之鱼, 🚀 节点选择, ♻️ 自动选择, 🛠️ 手动选择, direct
[filter_remote]
# 局域网
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Lan/Lan.list, tag=局域网, force-policy=direct, update-interval=86400
