# Mihomo / Clash Party 主配置（第一版）
# 这是给 SubStore 合并订阅节点后的主配置模板。
# 项目仓库：https://github.com/Champion-Guan/personal-proxy-rules

mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

proxy-groups:
  # ---------- 节点管理 ----------
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🛠️ 手动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "☁️ AWS亚马逊服务器节点"
      - "🇹🇼 台湾节点"
      - DIRECT

  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🛠️ 手动选择"
    type: select
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)"

  # ---------- 服务策略 ----------
  - name: "🤖 AI平台"
    type: select
    proxies:
      - "🇺🇸 美国节点"
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "🇷🇺Wildberries电商"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛠️ 手动选择"
      - "☁️ AWS亚马逊服务器节点"
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"

  - name: "🛒Amazon电商"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "✈️X电报"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "▶️YouTube"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "🎵Spotify"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "📺哔哩哔哩"
    type: select
    proxies:
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"
      - DIRECT

  - name: "🛡️ 广告拦截"
    type: select
    # REJECT = 开启拦截；DIRECT = 关闭拦截
    proxies:
      - REJECT
      - DIRECT

  - name: "🛟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动选择"
      - "🛠️ 手动选择"
      - DIRECT

  # ---------- 地区节点 ----------
  - name: "☁️ AWS亚马逊服务器节点"
    type: url-test
    include-all: true
    filter: "(?i)(AWS|亚马逊|Amazon)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    # US/USA 必须是独立标签，避免把 Russia、亚美尼亚等名称误匹配进来。
    filter: "(?i)(美国|美西|美东|美中|美南|🇺🇸|United ?States|洛杉矶|纽约|旧金山|西雅图|芝加哥|达拉斯|俄亥俄|俄勒冈|弗吉尼亚|Los ?Angeles|New ?York|San ?Francisco|Seattle|Chicago|Dallas|Ohio|Oregon|Virginia|(^|[^A-Za-z])(US|USA)([^A-Za-z]|$))"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "(?i)(日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇸🇬 新加坡节点"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|SG|Singapore)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "(?i)(香港|港|HK|Hong ?Kong|HongKong)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)(台湾|台灣|台|TW|Taiwan|台北|臺北|高雄|Taipei|Kaohsiung)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

rule-providers:
  openai_core:
    type: inline
    behavior: classical
    format: yaml
    payload:
      - DOMAIN-SUFFIX,chatgpt.com
      - DOMAIN-SUFFIX,openai.com
      - DOMAIN-SUFFIX,oaiusercontent.com
      - DOMAIN-SUFFIX,oaistatic.com
      - DOMAIN-SUFFIX,auth.openai.com
      - DOMAIN-SUFFIX,challenges.cloudflare.com
      - DOMAIN-SUFFIX,ws.chatgpt.com
  lan:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml"
    path: ./规则缓存/局域网.yaml
    interval: 86400
  loya_reject:
