    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml"
    path: ./规则缓存/YouTube媒体.yaml
    interval: 86400
  spotify:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml"
    path: ./规则缓存/Spotify音乐.yaml
    interval: 86400
  bilibili:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/Champion-Guan/personal-proxy-rules/main/%E8%A7%84%E5%88%99%E9%9B%86/Clash%E8%A7%84%E5%88%99/%E5%93%94%E5%93%A9%E5%93%94%E5%93%A9.yaml"
    path: ./规则缓存/哔哩哔哩.yaml
