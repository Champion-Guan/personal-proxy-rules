name: 检查上游规则

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  check:
    name: 检查规则来源与配置格式
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 校验配置与规则格式
        run: |
          python3 '脚本/同步AI核心规则.py' --check
          python3 '脚本/测试AI规则.py'
          ruby -e 'require "yaml"; YAML.load_file("配置/Clash主配置.yaml"); Dir["规则集/Clash规则/*.yaml"].each { |file| YAML.load_file(file) }; puts "YAML 格式校验通过"'

      - name: 检查远程规则网址
        shell: bash
        run: |
          set -euo pipefail
          urls_file="$(mktemp)"
          trap 'rm -f "$urls_file"' EXIT

          ruby -ryaml -e '
            config = YAML.load_file("配置/Clash主配置.yaml")
            config.fetch("rule-providers", {}).each_value do |provider|
              next unless provider.is_a?(Hash) && provider["type"] == "http"
              puts provider["url"] if provider["url"]
            end
          ' > "$urls_file"

          for config in '配置/圈X分流模板.conf' '配置/圈X自动配置.conf'; do
            awk '
              /^\[filter_remote\][[:space:]]*$/ { in_filter_remote = 1; next }
              /^\[[^]]+\][[:space:]]*$/ { in_filter_remote = 0 }
              in_filter_remote && /^[[:space:]]*https:\/\// {
                url = $0
                sub(/^[[:space:]]*/, "", url)
                sub(/,.*/, "", url)
                print url
              }
            ' "$config" >> "$urls_file"
          done

          sort -u "$urls_file" \
            | grep -Ev '\.(png|jpg|jpeg|gif|svg)(\?.*)?$' \
            | while IFS= read -r url; do
                echo "正在检查：$url"
                curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 \
                  --connect-timeout 20 --max-time 120 \
                  --silent --show-error --output /dev/null "$url"
              done
